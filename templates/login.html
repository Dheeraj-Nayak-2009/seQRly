<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seQRly – Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/607a222a2c.js" crossorigin="anonymous"></script>
    <style>
        
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-base:#0d0d12; --bg-surface:#16161f; --bg-elevated:#1e1e2a; --bg-card:#1a1a26;
            --border-subtle:rgba(255,255,255,0.06); --border-medium:rgba(255,255,255,0.08);
            --text-primary:#f0ece4; --text-secondary:#aea9a0; --text-muted:#6f6a62;
            --accent:#d4a373; --accent-dim:rgba(212,163,115,0.15); --accent-glow:rgba(212,163,115,0.25);
            --shadow-card:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.03);
            --shadow-glow:0 8px 40px rgba(212,163,115,0.08);
            --radius-sm:6px; --radius-md:10px; --radius-lg:18px; --radius-xl:24px;
            --font-sans:'Lexend',-apple-system,sans-serif; --font-serif:'Playfair Display',serif;
            --grain-opacity:0.035;
        }
        [data-theme="light"] {
            --bg-base:#f4f1ec; --bg-surface:#ede9e2; --bg-elevated:#e5dfd6; --bg-card:#faf8f5;
            --border-subtle:rgba(0,0,0,0.06); --border-medium:rgba(0,0,0,0.08);
            --text-primary:#1e1b18; --text-secondary:#4f4a44; --text-muted:#8a847c;
            --accent:#b8864b; --accent-dim:rgba(184,134,75,0.12); --accent-glow:rgba(184,134,75,0.15);
            --shadow-card:0 8px 32px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.02);
            --shadow-glow:0 8px 40px rgba(184,134,75,0.06);
            --grain-opacity:0.04;
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            background-repeat:repeat; background-size:256px 256px;
            opacity:var(--grain-opacity); mix-blend-mode:overlay;
        }
        html { scroll-behavior:smooth; }
        body {
            font-family:var(--font-sans); background:var(--bg-base); color:var(--text-primary);
            line-height:1.6; min-height:100vh; position:relative;
            transition:background .3s,color .3s;
        }
        .ambient-glow {
            position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0;
            opacity:0.3; transition:opacity .6s;
        }
        .ambient-glow.g1 { width:600px; height:600px; background:var(--accent); top:-200px; right:-150px; opacity:0.12; }
        .ambient-glow.g2 { width:500px; height:500px; background:#6b8c7c; bottom:-150px; left:-100px; opacity:0.08; }
        [data-theme="light"] .ambient-glow.g1 { opacity:0.06; }
        [data-theme="light"] .ambient-glow.g2 { opacity:0.04; }

        .container { max-width:1200px; margin:0 auto; padding:0 1.5rem; position:relative; z-index:1; }

        
        nav {
            display:flex; align-items:center; justify-content:space-between;
            padding:1.25rem 0 1.5rem; border-bottom:1px solid var(--border-subtle);
        }
        .logo {
            font-family:var(--font-serif); font-size:1.8rem; font-weight:700; letter-spacing:-0.02em;
            background:linear-gradient(135deg,var(--text-primary) 40%,var(--accent));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .btn {
            font-family:var(--font-sans); font-weight:600; font-size:0.9rem;
            padding:0.6rem 1.6rem; border-radius:var(--radius-sm); border:none;
            cursor:pointer; text-decoration:none; display:inline-block;
            transition:all .25s ease; background:transparent; color:var(--text-primary);
            position:relative; overflow:hidden;
        }
        .btn::after {
            content:''; position:absolute; inset:0; border-radius:inherit;
            background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.04),transparent 70%);
            pointer-events:none;
        }
        .btn-ghost { color:var(--text-secondary); padding:0.4rem 0.8rem; }
        .btn-ghost:hover { color:var(--text-primary); background:var(--bg-elevated); border-radius:var(--radius-sm); }
        .btn-primary {
            background:var(--accent); color:#0d0d12; border:1px solid var(--accent);
            box-shadow:0 4px 16px var(--accent-glow);
        }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 32px var(--accent-glow); filter:brightness(1.08); }

        .nav-actions { display:flex; gap:0.6rem; align-items:center; }

        
        .auth-card {
            max-width:420px; margin:4rem auto;
            background:var(--bg-card); border-radius:var(--radius-md);
            padding:2.5rem 2rem; border:1px solid var(--border-subtle);
            box-shadow:var(--shadow-card); position:relative;
        }
        .auth-card h2 {
            font-family:var(--font-serif); font-size:2rem; margin-bottom:0.5rem; text-align:center;
        }
        .auth-card .sub { text-align:center; color:var(--text-secondary); margin-bottom:2rem; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; font-weight:500; font-size:0.9rem; margin-bottom:0.3rem; }
        .form-group input {
            width:100%; padding:0.7rem 1rem;
            border-radius:var(--radius-sm); border:1px solid var(--border-medium);
            background:var(--bg-elevated); color:var(--text-primary);
            font-family:var(--font-sans); transition:border-color .3s;
        }
        .form-group input:focus { outline:none; border-color:var(--accent); }
        .form-check { display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem; }
        .form-check input { width:auto; }
        .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-secondary); }
        .auth-footer a { color:var(--accent); text-decoration:none; }
        .flash-messages { margin-bottom:1rem; }
        .flash { padding:0.6rem 1rem; border-radius:var(--radius-sm); font-size:0.9rem; }
        .flash.success { background:var(--accent-dim); color:var(--accent); }
        .flash.danger { background:rgba(255,0,0,0.1); color:#ff6b6b; }

        footer { padding:2rem 0 1.5rem; border-top:1px solid var(--border-subtle); text-align:center; color:var(--text-muted); font-size:0.85rem; }
        @media (max-width:480px) { .auth-card { padding:1.5rem; } }
    </style>
</head>
<body>
    <div class="ambient-glow g1"></div>
    <div class="ambient-glow g2"></div>

    <div class="container">
        <nav>
            <span class="logo">seQRly</span>
            <div class="nav-actions">
                <a href="{{ url_for('index') }}" class="btn btn-ghost btn-sm">Home</a>
            </div>
        </nav>

        <div class="auth-card">
            <h2>Welcome back</h2>
            <p class="sub">Log in to access your QR packs</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <div class="form-check">
                    <input type="checkbox" id="remember" name="remember" />
                    <label for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
            </form>

            <div class="auth-footer">
                Don’t have an account? <a href="{{ url_for('register') }}">Sign up</a>
            </div>
        </div>

        <footer>
            <span>© 2026 seQRly</span>
        </footer>
    </div>

    <script>
        
        const html = document.documentElement;
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const stored = localStorage.getItem('seqrly-theme');
        let currentTheme = stored || (prefersDark ? 'dark' : 'light');
        html.setAttribute('data-theme', currentTheme);
        
    </script>
</body>
</html>
